# HTTPS 已经通过公网可信证书验收后，才复制到 server-local/devscope-http-domain.conf。
server {
    listen 80;
    server_name devscope.cn www.devscope.cn;

    # 共享应用保留原 HTTP 路由；只有 DevScope fallback 跳转到独立 TLS。
    include /etc/nginx/conf.d/server-local/shared-routes*.conf;
    include /etc/nginx/conf.d/server-local/devscope-acme.conf;
    location / {
        return 308 https://$host$request_uri;
    }
}
