# 只复制到 server-local/devscope-acme.conf；webroot 不含配置/认证/证书。
# 原始 URI 也必须是单段 base64url token；拒绝编码路径及目录穿越。
location ~ ^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$ {
    if ($request_uri !~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+(\?.*)?$") { return 404; }
    auth_basic off;
    root /etc/nginx/conf.d/server-local/acme-webroot;
    default_type text/plain;
    autoindex off;
    disable_symlinks on;
    try_files $uri =404;
}

location /.well-known/acme-challenge/ {
    auth_basic off;
    return 404;
}
