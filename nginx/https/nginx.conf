worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    ssl_protocols TLSv1.2 TLSv1.3;

    upstream api_backend { server api:3100; }
    upstream web_backend { server web:3000; }

    # 未知 SNI/Host 不作为第二个可访问站点。
    server {
        listen 443 ssl default_server;
        ssl_reject_handshake on;
        return 444;
    }

    server {
        listen 443 ssl;
        server_name devscope.cn www.devscope.cn;
        ssl_certificate /etc/letsencrypt/live/devscope.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/devscope.cn/privkey.pem;
        ssl_session_cache shared:DevScopeTLS:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        client_max_body_size 10m;

        # 精确 include：认证片段缺失必须使 nginx -t / 启动失败。
        # locations 继续使用同一生产认证片段；不加载 shared-routes。
        include /etc/nginx/conf.d/server-local/devscope-auth.conf;
        include /etc/nginx/conf.d/devscope-locations.inc;
    }
}
