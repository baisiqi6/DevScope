upstream api_backend {
    server api:3100;
}

upstream web_backend {
    server web:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # 服务器专属共享路由，由生产主机维护且不进入 Git。
    include /etc/nginx/conf.d/server-local/shared-routes*.conf;

    # 阶段一：仅在服务器安装 ACME 例外；不存在时保持原行为。
    include /etc/nginx/conf.d/server-local/devscope-acme*.conf;
    include /etc/nginx/conf.d/devscope-locations.inc;
}

# 阶段二：公网 HTTPS 验证后才安装精确域名重定向 server。
include /etc/nginx/conf.d/server-local/devscope-http-domain*.conf;
