name: Build and Deploy

on:
  # 生产服务仍在运行，服务器上存在需要保护的本地配置。
  # 在 CI、迁移和配置对账全部完成前，只允许手动部署。
  workflow_dispatch:
    inputs:
      technology_stack_legacy_cleanup:
        description: 'Phase C 显式维护窗口操作：删除技术栈 legacy 伪数据（需独立授权，默认关闭）'
        type: boolean
        default: false
      apply_database_migration:
        description: '备份数据库并显式执行已审查的 Drizzle 迁移'
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  # GHCR 要求全小写，github.repository 保留大小写 DevScope 会导致推送失败
  IMAGE_NAME_API: baisiqi6/devscope/api
  IMAGE_NAME_WORKER: baisiqi6/devscope/worker
  IMAGE_NAME_WEB: baisiqi6/devscope/web

# Phase C（implementation review P2-2）：deploy 与 cleanup 共享 production 并发组，
# 普通部署 run 与 cleanup 维护窗口 run 互相排队，不并发触碰生产
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 47.120.41.136
          username: devscope
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            cd /home/devscope/DevScope

            # 部署前必须先对账生产工作树，不得覆盖受保护的 compose
            # 或共享 Nginx 配置。
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Server worktree is dirty; reconcile protected config before deployment"
              exit 1
            fi
            # 服务器到 GitHub 的 TLS 连接不稳定（今夜 4/7 部署首次失败），
            # git pull 需要有界重试，避免人工重启整个 workflow
            for attempt in 1 2 3; do
              if git pull --ff-only origin main; then
                break
              fi
              echo "git pull attempt $attempt failed; retrying in 10s..."
              sleep 10
              if [ "$attempt" = "3" ]; then
                echo "git pull failed after 3 attempts"
                exit 1
              fi
            done

            # 用 PAT 登录 GHCR（GITHUB_TOKEN 无法在 SSH 远程使用）
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u baisiqi6 --password-stdin

            # 拉取最新镜像（不动 postgres 和 nginx）
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api web worker

            if [ "${{ inputs.apply_database_migration }}" = "true" ]; then
              backup_dir="/home/devscope/backups/devscope"
              backup_file="$backup_dir/pre-migration-$(date +%Y%m%d-%H%M%S).dump"
              install -d -m 700 "$backup_dir"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
                pg_dump -U postgres -d devscope --format=custom > "$backup_file"
              chmod 600 "$backup_file"

              docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps \
                -e PGOPTIONS="-c lock_timeout=5s" api \
                pnpm --filter @devscope/db db:migrate
            fi

            # 未显式执行迁移时也必须先验证 Worker 所需 schema 已存在。
            if [ "$(docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
              psql -U postgres -d devscope -tAc "select count(*) from pg_tables where schemaname='public' and tablename in ('jobs','radar_candidates','github_trending_snapshots','github_trending_entries')" | tr -d '[:space:]')" != "4" ]; then
              echo "Worker schema is missing; rerun the manual workflow with apply_database_migration=true after review"
              exit 1
            fi

            # 只重建 DevScope 应用服务，不重启或覆盖共享 Nginx。
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate api web worker

            # 等待服务启动
            sleep 10

            # Schema 变更必须使用经过审查且纳入版本控制的迁移；
            # 只有 workflow_dispatch 显式输入为 true 时才执行。

            # 健康检查
            if ! curl -sf http://localhost:3100/trpc/health > /dev/null 2>&1; then
              echo "API health check failed"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 api
              exit 1
            fi

            if ! curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Web health check failed"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 web
              exit 1
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' devscope-worker 2>/dev/null)" != "true" ]; then
              echo "Worker is not running"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 worker
              exit 1
            fi

            # API/Web 容器重建后 upstream 地址可能变化。先验证全部共享配置，
            # 再 graceful reload；不重启 Nginx，也不修改服务器专属片段。
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload

            # 清理旧镜像
            docker image prune -f

            echo "Deployment completed successfully!"

  technology-stack-cleanup:
    if: github.event.inputs.technology_stack_legacy_cleanup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 与普通 deploy 的互斥由 workflow 顶层 concurrency: production 保证
    steps:
      - name: Refuse concurrent migration and cleanup
        run: |
          if [ "${{ github.event.inputs.apply_database_migration }}" = "true" ]; then
            echo "technology_stack_legacy_cleanup 与 apply_database_migration 互斥"
            exit 1
          fi

      - name: Preflight validation (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/devscope/DevScope
            # revision 对账（implementation review P2-3）：服务器工作树必须与本 run
            # 的 commit 一致，运行中容器必须来自当前镜像——防止对滞留旧 revision
            # 的部署执行 cleanup
            if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
              echo "服务器工作树 HEAD 与本 run revision 不一致，先完成普通部署再执行 cleanup"
              exit 1
            fi
            for svc in api worker; do
              ref="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --images | grep "/${svc}:")"
              running="$(docker inspect -f '{{.Image}}' "devscope-${svc}")"
              expected="$(docker image inspect --format '{{.Id}}' "$ref")"
              if [ "$running" != "$expected" ]; then
                echo "devscope-${svc} 未运行当前镜像（revision 滞留），拒绝 cleanup"
                exit 1
              fi
            done
            grep -q '^TECHNOLOGY_STACK_STORAGE_MODE=new_only$' .env || { echo "mode 不是 new_only，拒绝 cleanup"; exit 1; }
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps api \
              node packages/db/dist/cleanup-cli.mjs --validate

      - name: Backup before cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/devscope/DevScope
            backup_dir="/home/devscope/backups/devscope"
            backup_file="$backup_dir/pre-cleanup-$(date +%Y%m%d-%H%M%S).dump"
            install -d -m 700 "$backup_dir"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
              pg_dump -U postgres -d devscope --format=custom > "$backup_file"
            chmod 600 "$backup_file"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
              pg_restore --list < "$backup_file" | grep -c "TABLE DATA" && echo "backup readable"

      - name: Execute cleanup (maintenance window)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/devscope/DevScope
            docker compose -f docker-compose.yml -f docker-compose.prod.yml stop api worker
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps api \
              node packages/db/dist/cleanup-cli.mjs --execute
            sed -i 's/^TECHNOLOGY_STACK_STORAGE_MODE=new_only$/TECHNOLOGY_STACK_STORAGE_MODE=legacy_cleaned/' .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api worker
            sleep 12
            curl -sf -m 10 http://127.0.0.1:3100/trpc/health >/dev/null || { docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 api; exit 1; }
            curl -s -o /dev/null -w "unauth:%{http_code}\n" http://127.0.0.1:80/
            echo "cleanup 完成；生产摘要与 MCP 核对按 runbook 维护窗口清单执行"
