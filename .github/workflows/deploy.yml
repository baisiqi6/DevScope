name: Build and Deploy

on:
  # 生产服务仍在运行，服务器上存在需要保护的本地配置。
  # 在 CI、迁移和配置对账全部完成前，只允许手动部署。
  workflow_dispatch:
    inputs:
      technology_stack_legacy_cleanup:
        description: 'Phase C 显式维护窗口操作：删除技术栈 legacy 伪数据（需独立授权，默认关闭）'
        type: boolean
        default: false
      apply_database_migration:
        description: '备份数据库并显式执行已审查的 Drizzle 迁移'
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  # GHCR 要求全小写，github.repository 保留大小写 DevScope 会导致推送失败
  IMAGE_NAME_API: baisiqi6/devscope/api
  IMAGE_NAME_WORKER: baisiqi6/devscope/worker
  IMAGE_NAME_WEB: baisiqi6/devscope/web

# Phase C（implementation review P2-2）：deploy 与 cleanup 共享 production 并发组，
# 普通部署 run 与 cleanup 维护窗口 run 互相排队，不并发触碰生产
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 生产服务器不再主动访问 GitHub；完整历史用于生成可验证、可
          # fast-forward 的 Git bundle。
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_API }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Extract metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WEB }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Extract metadata for Worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_WORKER }}
          tags: |
            type=sha,prefix=
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare proxy-independent deployment bundle
        if: github.event.inputs.technology_stack_legacy_cleanup != 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 deploy-transfer

          git bundle create deploy-transfer/repository.bundle HEAD

          api_image="${REGISTRY}/${IMAGE_NAME_API}:${GITHUB_SHA}"
          web_image="${REGISTRY}/${IMAGE_NAME_WEB}:${GITHUB_SHA}"
          worker_image="${REGISTRY}/${IMAGE_NAME_WORKER}:${GITHUB_SHA}"
          docker pull "$api_image"
          docker pull "$web_image"
          docker pull "$worker_image"
          docker save "$api_image" "$web_image" "$worker_image" \
            | gzip -1 > deploy-transfer/images.tar.gz

          (
            cd deploy-transfer
            sha256sum repository.bundle images.tar.gz > SHA256SUMS
          )

      - name: Transfer deployment bundle over SSH
        if: github.event.inputs.technology_stack_legacy_cleanup != 'true'
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "deploy-transfer/*"
          target: "/home/devscope/deploy-staging/${{ github.sha }}-${{ github.run_id }}"
          strip_components: 1
          overwrite: true
          command_timeout: 10m

  deploy:
    needs: build
    # cleanup 维护窗口 run 不做普通部署（review P2-1：避免 force-recreate 与
    # cleanup 停服/删除链并行交错；cleanup 面向的是已部署 revision）
    if: github.event.inputs.technology_stack_legacy_cleanup != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            cd /home/devscope/DevScope

            target_sha="${{ github.sha }}"
            run_id="${{ github.run_id }}"
            case "$target_sha" in
              ''|*[!0-9a-f]*) echo "Invalid target SHA"; exit 1 ;;
            esac
            case "$run_id" in
              ''|*[!0-9]*) echo "Invalid GitHub run ID"; exit 1 ;;
            esac
            if [ "${#target_sha}" -ne 40 ]; then
              echo "Target SHA must be the full 40-character commit ID"
              exit 1
            fi
            staging_dir="/home/devscope/deploy-staging/${target_sha}-${run_id}"
            bundle_file="$staging_dir/repository.bundle"
            image_archive="$staging_dir/images.tar.gz"
            checksum_file="$staging_dir/SHA256SUMS"
            registry="${{ env.REGISTRY }}"
            api_image_name="${{ env.IMAGE_NAME_API }}"
            web_image_name="${{ env.IMAGE_NAME_WEB }}"
            worker_image_name="${{ env.IMAGE_NAME_WORKER }}"

            # 部署前必须先对账生产工作树，不得覆盖受保护的 compose
            # 或共享 Nginx 配置。
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Server worktree is dirty; reconcile protected config before deployment"
              exit 1
            fi

            # GitHub runner 已通过现有 SSH authority 传入精确 bundle 与镜像。
            # checksum、bundle 和 revision 任一不一致都必须在 runtime mutation 前失败。
            test -f "$bundle_file"
            test -f "$image_archive"
            test -f "$checksum_file"
            chmod 700 "$staging_dir"
            (
              cd "$staging_dir"
              sha256sum -c SHA256SUMS
            )
            git bundle verify "$bundle_file"
            gzip -t "$image_archive"

            deploy_ref="refs/devscope-deploy/${run_id}"
            git fetch "$bundle_file" "HEAD:${deploy_ref}"
            fetched_sha="$(git rev-parse "$deploy_ref")"
            if [ "$fetched_sha" != "$target_sha" ]; then
              echo "Transferred Git bundle does not match target SHA"
              git update-ref -d "$deploy_ref"
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD "$deploy_ref"; then
              echo "Target SHA is not a fast-forward of the production worktree"
              git update-ref -d "$deploy_ref"
              exit 1
            fi

            if [ "${{ inputs.apply_database_migration }}" != "true" ] && \
              [ "$(docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
                psql -U postgres -d devscope -tAc "select count(*) from pg_tables where schemaname='public' and tablename in ('jobs','radar_candidates','github_trending_snapshots','github_trending_entries')" | tr -d '[:space:]')" != "4" ]; then
              echo "Worker schema is missing; rerun with an explicitly reviewed migration"
              git update-ref -d "$deploy_ref"
              exit 1
            fi

            archive_size="$(stat -c '%s' "$image_archive")"
            available_bytes="$(df --output=avail -B1 "$staging_dir" | tail -1 | tr -d '[:space:]')"
            if [ "$available_bytes" -lt "$((archive_size * 2))" ]; then
              echo "Insufficient disk space to load deployment images"
              git update-ref -d "$deploy_ref"
              exit 1
            fi

            gzip -dc "$image_archive" | docker load
            # 先验证三个镜像全部属于目标提交，再改动任何 latest/rollback tag，
            # 避免后一个镜像失败时留下部分更新的 tag 状态。
            for svc in api web worker; do
              case "$svc" in
                api) image_name="${registry}/${api_image_name}" ;;
                web) image_name="${registry}/${web_image_name}" ;;
                worker) image_name="${registry}/${worker_image_name}" ;;
              esac
              exact_image="${image_name}:${target_sha}"
              revision="$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$exact_image")"
              if [ "$revision" != "$target_sha" ]; then
                echo "$svc image revision does not match target SHA"
                git update-ref -d "$deploy_ref"
                exit 1
              fi
            done

            for svc in api web worker; do
              case "$svc" in
                api) image_name="${registry}/${api_image_name}" ;;
                web) image_name="${registry}/${web_image_name}" ;;
                worker) image_name="${registry}/${worker_image_name}" ;;
              esac
              exact_image="${image_name}:${target_sha}"
              running_image="$(docker inspect -f '{{.Image}}' "devscope-${svc}")"
              docker tag "$running_image" "${image_name}:rollback"
              docker tag "$exact_image" "${image_name}:latest"
            done

            git merge --ff-only "$deploy_ref"
            git update-ref -d "$deploy_ref"

            if [ "${{ inputs.apply_database_migration }}" = "true" ]; then
              backup_dir="/home/devscope/backups/devscope"
              backup_file="$backup_dir/pre-migration-$(date +%Y%m%d-%H%M%S).dump"
              install -d -m 700 "$backup_dir"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
                pg_dump -U postgres -d devscope --format=custom > "$backup_file"
              chmod 600 "$backup_file"

              docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps \
                -e PGOPTIONS="-c lock_timeout=5s" api \
                pnpm --filter @devscope/db db:migrate
            fi

            # 未显式执行迁移时也必须先验证 Worker 所需 schema 已存在。
            if [ "$(docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
              psql -U postgres -d devscope -tAc "select count(*) from pg_tables where schemaname='public' and tablename in ('jobs','radar_candidates','github_trending_snapshots','github_trending_entries')" | tr -d '[:space:]')" != "4" ]; then
              echo "Worker schema is missing; rerun the manual workflow with apply_database_migration=true after review"
              exit 1
            fi

            # 只重建 DevScope 应用服务，不重启或覆盖共享 Nginx。
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate api web worker

            # 等待服务启动
            sleep 10

            # Schema 变更必须使用经过审查且纳入版本控制的迁移；
            # 只有 workflow_dispatch 显式输入为 true 时才执行。

            # 健康检查
            if ! curl -sf http://localhost:3100/trpc/health > /dev/null 2>&1; then
              echo "API health check failed"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 api
              exit 1
            fi

            if ! curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Web health check failed"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 web
              exit 1
            fi

            if [ "$(docker inspect -f '{{.State.Running}}' devscope-worker 2>/dev/null)" != "true" ]; then
              echo "Worker is not running"
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 worker
              exit 1
            fi

            # API/Web 容器重建后 upstream 地址可能变化。先验证全部共享配置，
            # 再 graceful reload；不重启 Nginx，也不修改服务器专属片段。
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -t
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T nginx nginx -s reload

            # 清理旧镜像
            docker image prune -f

            # target SHA 与 run ID 均已在上方严格验证，避免宽泛删除。
            rm -rf -- "$staging_dir"

            echo "Deployment completed successfully!"

  technology-stack-cleanup:
    if: github.event.inputs.technology_stack_legacy_cleanup == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 与普通 deploy 的互斥由 workflow 顶层 concurrency: production 保证
    steps:
      - name: Refuse concurrent migration and cleanup
        run: |
          if [ "${{ github.event.inputs.apply_database_migration }}" = "true" ]; then
            echo "technology_stack_legacy_cleanup 与 apply_database_migration 互斥"
            exit 1
          fi

      - name: Preflight validation (read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/devscope/DevScope
            # revision 对账（implementation review P2-3）：服务器工作树必须与本 run
            # 的 commit 一致，运行中容器必须来自当前镜像——防止对滞留旧 revision
            # 的部署执行 cleanup
            if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
              echo "服务器工作树 HEAD 与本 run revision 不一致，先完成普通部署再执行 cleanup"
              exit 1
            fi
            for svc in api worker; do
              ref="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config --images | grep "/${svc}:")"
              running="$(docker inspect -f '{{.Image}}' "devscope-${svc}")"
              expected="$(docker image inspect --format '{{.Id}}' "$ref")"
              if [ "$running" != "$expected" ]; then
                echo "devscope-${svc} 未运行当前镜像（revision 滞留），拒绝 cleanup"
                exit 1
              fi
            done
            grep -q '^TECHNOLOGY_STACK_STORAGE_MODE=new_only$' .env || { echo "mode 不是 new_only，拒绝 cleanup"; exit 1; }
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps api \
              node packages/db/dist/cleanup-cli.mjs --validate

      - name: Backup before cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd /home/devscope/DevScope
            backup_dir="/home/devscope/backups/devscope"
            backup_file="$backup_dir/pre-cleanup-$(date +%Y%m%d-%H%M%S).dump"
            install -d -m 700 "$backup_dir"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
              pg_dump -U postgres -d devscope --format=custom > "$backup_file"
            chmod 600 "$backup_file"
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
              pg_restore --list < "$backup_file" | grep -c "TABLE DATA" && echo "backup readable"

      - name: Execute cleanup (maintenance window)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/devscope/DevScope
            docker compose -f docker-compose.yml -f docker-compose.prod.yml stop api worker
            docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm --no-deps api \
              node packages/db/dist/cleanup-cli.mjs --execute
            sed -i 's/^TECHNOLOGY_STACK_STORAGE_MODE=new_only$/TECHNOLOGY_STACK_STORAGE_MODE=legacy_cleaned/' .env
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d api worker
            sleep 12
            curl -sf -m 10 http://127.0.0.1:3100/trpc/health >/dev/null || { docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=50 api; exit 1; }
            curl -s -o /dev/null -w "unauth:%{http_code}\n" http://127.0.0.1:80/
            echo "cleanup 完成；生产摘要与 MCP 核对按 runbook 维护窗口清单执行"
